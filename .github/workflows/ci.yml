name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  servidor:
    name: Server (Express + MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
    defaults:
      run:
        working-directory: servidor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servidor/package-lock.json
      - run: npm ci
      # Crea las tablas; con MySQL disponible, las pruebas de integración no se omiten
      - run: node db/init.js --esperar
      - run: npm test

  cliente:
    name: Client (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cliente
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cliente/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t dice-or-die .
